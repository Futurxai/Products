name: Puzzle Module Deploy

# Manual-only, deliberately — this workflow can deploy real Cloud
# Functions, Firestore/Storage Rules, and Hosting to the production
# lovedigitally-app project. It never runs on push or PR; someone must
# explicitly trigger it (Actions tab → this workflow → Run workflow),
# choosing exactly which pieces to deploy. See DEPLOYMENT.md.
on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "What to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - hosting-only
          - functions-only
          - rules-only

defaults:
  run:
    working-directory: apps/puzzle-module

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment: production # requires a GitHub Environment named "production" with required reviewers, if you want a manual approval gate on top of workflow_dispatch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/puzzle-module/package-lock.json

      - name: Install app dependencies (provides firebase-tools)
        run: npm ci

      - name: Install functions dependencies
        if: github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'functions-only'
        working-directory: apps/puzzle-module/functions
        run: npm ci

      # Real Firebase Web SDK config, sourced from GitHub Actions
      # repository secrets — see scripts/apply-prod-env.mjs's doc
      # comment for the exact three secret names required. Never
      # printed, never committed (the script restores the placeholder
      # file after the build completes, but this ephemeral runner is
      # discarded either way).
      - name: Build app (production, real Firebase config)
        if: github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'hosting-only'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: npm run build:deploy

      - name: Build functions
        if: github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'functions-only'
        working-directory: apps/puzzle-module/functions
        run: npm run build

      # A GCP service account JSON key with Firebase Admin / Deploy
      # permissions on lovedigitally-app, stored as a single repository
      # secret (the raw JSON content). Written to a temp file for this
      # step only — never logged, never committed.
      - name: Authenticate to Firebase
        if: github.event.inputs.deploy_target != ''
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # TEMPORARY — debugging a "Failed to authenticate, have you run
      # firebase login?" error from firebase-tools despite
      # GOOGLE_APPLICATION_CREDENTIALS being set. Prints ONLY safe
      # metadata (existence, byte length, JSON validity, presence of
      # required field names) — never the credential file's actual
      # content. Remove this step once the root cause is found.
      - name: Diagnose Firebase credential (temporary, safe metadata only)
        if: github.event.inputs.deploy_target != ''
        run: |
          EXPECTED_PATH="$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS matches the created credential file path: $([ "$GOOGLE_APPLICATION_CREDENTIALS" = "$EXPECTED_PATH" ] && echo YES || echo NO)"
          cat > "$RUNNER_TEMP/diagnose-credential.cjs" <<'DIAGNOSE_EOF'
          const fs = require('fs');
          const path = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          const exists = !!path && fs.existsSync(path);
          console.log('credential file exists:', exists ? 'YES' : 'NO');
          if (!exists) process.exit(0);
          const raw = fs.readFileSync(path, 'utf8');
          console.log('credential file byte length:', Buffer.byteLength(raw, 'utf8'));
          let parsed;
          try {
            parsed = JSON.parse(raw);
            console.log('JSON.parse succeeds: YES');
          } catch (e) {
            console.log('JSON.parse succeeds: NO');
            process.exit(0);
          }
          const hasField = (name) => typeof parsed[name] === 'string' && parsed[name].length > 0;
          const required = ['project_id', 'client_email', 'private_key'];
          console.log('required service-account fields present:', required.every(hasField) ? 'YES' : 'NO');
          console.log('project_id present:', hasField('project_id') ? 'YES' : 'NO');
          console.log('client_email present:', hasField('client_email') ? 'YES' : 'NO');
          console.log('private_key present:', hasField('private_key') ? 'YES' : 'NO');
          console.log('type field (safe, expected literal "service_account"):', parsed.type === 'service_account' ? 'service_account' : 'UNEXPECTED');
          DIAGNOSE_EOF
          node "$RUNNER_TEMP/diagnose-credential.cjs"

      - name: Deploy — all
        if: github.event.inputs.deploy_target == 'all'
        run: npx firebase deploy --project lovedigitally-app --only firestore:rules,storage:rules,functions:puzzle-module,hosting:puzzle-module --non-interactive

      - name: Deploy — Hosting only
        if: github.event.inputs.deploy_target == 'hosting-only'
        run: npx firebase deploy --project lovedigitally-app --only hosting:puzzle-module --non-interactive

      - name: Deploy — Functions only
        if: github.event.inputs.deploy_target == 'functions-only'
        run: npx firebase deploy --project lovedigitally-app --only functions:puzzle-module --non-interactive

      - name: Deploy — Rules only
        if: github.event.inputs.deploy_target == 'rules-only'
        run: npx firebase deploy --project lovedigitally-app --only firestore:rules,storage:rules --non-interactive
