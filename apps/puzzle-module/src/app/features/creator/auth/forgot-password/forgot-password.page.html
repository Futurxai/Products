<ion-content class="forgot-password-page">
  <app-auth-shell title="Reset your password" subtitle="We'll email you a link to get back in">
    @if (submitted()) {
      <div class="forgot-password-page__success" role="status">
        <p>If an account exists for that email, a reset link is on its way. Check your inbox (and spam folder).</p>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <app-input
          formControlName="email"
          label="Email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          [required]="true"
          [errorMessage]="emailError"
        ></app-input>

        @if (errorMessage()) {
          <p class="forgot-password-page__error" role="alert">{{ errorMessage() }}</p>
        }

        <app-button type="submit" expand="block" [loading]="loading()">Send reset link</app-button>
      </form>
    }

    <p class="forgot-password-page__footer-link"><a routerLink="/auth/login">Back to sign in</a></p>
  </app-auth-shell>
</ion-content>
