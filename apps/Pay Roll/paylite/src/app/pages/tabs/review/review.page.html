<ion-header>
  <ion-toolbar>
    <ion-title>Review leave requests</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-list lines="full" *ngIf="requests.length; else emptyList">
      <ion-item *ngFor="let r of requests">
        <ion-label class="ion-text-wrap">
          <div class="fx-review-row">
            <div>
              <h3>{{ employeeFor(r)?.full_name }}</h3>
              <p>{{ r.start_date }} → {{ r.end_date }} · {{ r.reason }}</p>
            </div>
            <ion-badge [color]="r.status === 'approved' ? 'success' : r.status === 'rejected' ? 'danger' : 'warning'">
              {{ r.status }}
            </ion-badge>
          </div>
          <div class="fx-review-actions" *ngIf="r.status === 'pending'">
            <ion-button size="small" color="primary" (click)="approve(r.id)">Approve</ion-button>
            <ion-button size="small" fill="outline" color="danger" (click)="reject(r.id)">Reject</ion-button>
          </div>
        </ion-label>
      </ion-item>
    </ion-list>
    <ng-template #emptyList>
      <div class="fx-empty">No leave requests to review.</div>
    </ng-template>
  </ion-card>
</ion-content>
