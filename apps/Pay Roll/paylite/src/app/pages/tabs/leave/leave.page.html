<ion-header>
  <ion-toolbar>
    <ion-title>My leave requests</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-list lines="full" *ngIf="myRequests.length; else emptyList">
      <ion-item *ngFor="let r of myRequests">
        <ion-label>
          <h3>{{ r.start_date }} → {{ r.end_date }}</h3>
          <p>{{ r.reason }}</p>
        </ion-label>
        <ion-badge slot="end"
          [color]="r.status === 'approved' ? 'success' : r.status === 'rejected' ? 'danger' : 'warning'">
          {{ r.status }}
        </ion-badge>
      </ion-item>
    </ion-list>
    <ng-template #emptyList>
      <div class="fx-empty">No leave requests yet.</div>
    </ng-template>
  </ion-card>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="primary" (click)="openModal()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-modal [isOpen]="modalOpen" (didDismiss)="closeModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Apply for leave</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="closeModal()">Close</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-item lines="none" class="fx-field">
          <ion-input label="Start date" labelPlacement="stacked" type="date" [(ngModel)]="start"></ion-input>
        </ion-item>
        <ion-item lines="none" class="fx-field">
          <ion-input label="End date" labelPlacement="stacked" type="date" [(ngModel)]="end"></ion-input>
        </ion-item>
        <ion-item lines="none" class="fx-field">
          <ion-textarea label="Reason" labelPlacement="stacked" [(ngModel)]="reason"></ion-textarea>
        </ion-item>
        <p class="fx-err" *ngIf="error">{{ error }}</p>
        <ion-button expand="block" color="primary" (click)="submit()">Submit request</ion-button>
        <ion-button expand="block" fill="outline" color="light" (click)="closeModal()">Cancel</ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
