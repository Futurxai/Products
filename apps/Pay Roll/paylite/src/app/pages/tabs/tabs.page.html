<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" href="/tabs/home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="attendance" href="/tabs/attendance">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-label>Attendance</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="leave" href="/tabs/leave">
      <ion-icon name="create-outline"></ion-icon>
      <ion-label>Leave</ion-label>
    </ion-tab-button>
    <ng-container *ngIf="state.isManager">
      <ion-tab-button tab="review" href="/tabs/review">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
        <ion-label>Review</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="payroll" href="/tabs/payroll">
        <ion-icon name="cash-outline"></ion-icon>
        <ion-label>Payroll</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="budget" href="/tabs/budget">
        <ion-icon name="pie-chart-outline"></ion-icon>
        <ion-label>Budget</ion-label>
      </ion-tab-button>
    </ng-container>
  </ion-tab-bar>
</ion-tabs>
