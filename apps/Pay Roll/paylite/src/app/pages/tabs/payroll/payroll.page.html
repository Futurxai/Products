<ion-header>
  <ion-toolbar>
    <ion-title>Payroll</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p class="fx-hint">{{ monthLabel }} · (Salary ÷ working days) × days present</p>

  <ion-card>
    <ion-list lines="full" *ngIf="items.length; else emptyList">
      <ion-item *ngFor="let it of items">
        <ion-label>
          <h3>{{ it.full_name }}</h3>
          <p>{{ it.days_present }} / {{ it.working_days }} working days present</p>
        </ion-label>
        <div slot="end" class="fx-num-big mono">₹{{ it.computed_payroll | number:'1.2-2' }}</div>
      </ion-item>
    </ion-list>
    <ng-template #emptyList>
      <div class="fx-empty">No employees yet.</div>
    </ng-template>
  </ion-card>
</ion-content>
