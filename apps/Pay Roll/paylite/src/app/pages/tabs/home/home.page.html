<ion-header>
  <ion-toolbar>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card *ngIf="state.currentUser as u">
    <ion-card-content class="fx-user-row">
      <div>
        <div class="fx-user-name">{{ u.full_name }}</div>
        <div class="fx-num-sm">{{ u.role === 'manager' ? 'Manager' : 'Employee' }} · ₹{{ u.monthly_salary | number:'1.0-0' }}/mo</div>
      </div>
      <ion-badge [color]="u.role === 'manager' ? 'success' : 'medium'">{{ u.role }}</ion-badge>
    </ion-card-content>
  </ion-card>

  <h2 class="fx-section">Quick actions</h2>
  <ion-card>
    <ion-list lines="full">
      <ion-item button detail (click)="goto('attendance')">
        <ion-label>Mark today's attendance</ion-label>
      </ion-item>
      <ion-item button detail (click)="goto('leave')">
        <ion-label>Apply for leave</ion-label>
      </ion-item>
      <ng-container *ngIf="state.isManager">
        <ion-item button detail (click)="goto('review')">
          <ion-label>Review pending leave requests</ion-label>
        </ion-item>
        <ion-item button detail lines="none" (click)="goto('payroll')">
          <ion-label>View payroll</ion-label>
        </ion-item>
      </ng-container>
    </ion-list>
  </ion-card>

  <ion-button expand="block" fill="outline" color="danger" class="fx-signout" (click)="signOut()">Sign out</ion-button>
</ion-content>
